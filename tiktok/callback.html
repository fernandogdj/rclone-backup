<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Autorização TikTok</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}code{background:#f2f2f2;padding:2px 6px;border-radius:4px;word-break:break-all}</style></head><body>
<h1>Autorização TikTok</h1>
<p id="msg">Enviando a autorização para o servidor…</p>
<script>
var q = location.search;
if (q.indexOf('code=') >= 0) {
  // o servidor só é acessível na rede de casa
  location.replace('http://192.168.0.40:8799/callback' + q);
  setTimeout(function(){ document.getElementById('msg').innerHTML = 'Se nada aconteceu, conecte no Wi-Fi de casa e abra o link de autorização de novo.'; }, 6000);
} else {
  document.getElementById('msg').textContent = 'Autorização não recebida' + (q ? ' (' + decodeURIComponent(q.slice(1)) + ')' : '') + '.';
}
</script>
</body></html>
